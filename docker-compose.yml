services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: InventoryReservation.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Postgres
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=inventory_reservation;Username=postgres;Password=postgres
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:


